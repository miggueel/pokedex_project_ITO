<!DOCTYPE html>
<html>
<head>
  <title>Mi Buscador Pokemon</title>
</head>
<body>

  <h1>Buscador de Pokemon</h1>
  <input type="text" id="busqueda" placeholder="Escribe pikachu o 25">
  <button onclick="buscarPokemon()">Buscar</button>
  <hr>

  
  <div id="resultado"></div>

  <script>
    function buscarPokemon() {
      let texto = document.getElementById('busqueda').value;

      //petición 
      fetch('https://pokeapi.co/api/v2/pokemon/' + texto.toLowerCase())
        .then(function(respuesta) {
          return respuesta.json();
        })
        .then(function(datos) {
          //Modificar usando innerHTML
          document.getElementById('resultado').innerHTML = `
            <h2>${datos.name}</h2>
            <p>ID: ${datos.id}</p>
            <p>Peso: ${datos.weight}</p>
            <img src="${datos.sprites.front_default}">
          `;
        })
        .catch(function(error) {
          document.getElementById('resultado').innerHTML = "<p>No se encontró el Pokémon.</p>";
        });
    }
  </script>

</body>
</html>
